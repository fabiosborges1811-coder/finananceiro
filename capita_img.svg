<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .border{
                fill:none;
                stroke:#F4F1EB;
                stroke-width:14;
            }

            .letter{
                font-family: "Georgia", "Times New Roman", serif;
                font-size:240px;
                fill:#F4F1EB;
                font-weight:500;
            }

            .dot{
                fill:#C9A35A;
            }
        </style>
    </defs>

    <!-- Moldura -->
    <rect x="52" y="52" width="408" height="408" rx="70" class="border"></rect>

    <!-- Letra -->
    <text x="152" y="315" class="letter">C</text>

    <!-- Ponto -->
    <circle cx="360" cy="320" r="10" class="dot"></circle>
</svg>